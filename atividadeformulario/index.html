<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário empresa XYZ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Modelo de página</h1>

    <fieldset><h2>Form name</h2></fieldset>

    <fieldset>

        <fieldset><h2>Form name</h2></fieldset>

        <label for="nome"> Nome: <input type="text" name="" id="nome"> </label>
        
        <br>

        <label class="Data-Nascimento">Data de Nascimento:
            <input type="date">
        </label>
        
        <br>

        <label class="Endereco">Endereço:
            <input type="text">
        </label>
        
        <br>

        <label class="NRO">Nro:
            <input type="text">
        </label>
        
        <br>

        <label class="Cidade">Cidade:
            <input type="text">
        </label>

        <br>
        
        <label class="Estado">Estado:
            <select name="estado"> 
                <option value="estado"></option> 
                <option value="ac">Acre</option> 
                <option value="al">Alagoas</option> 
                <option value="am">Amazonas</option> 
                <option value="ap">Amapá</option> 
                <option value="ba">Bahia</option> 
                <option value="ce">Ceará</option> 
                <option value="df">Distrito Federal</option> 
                <option value="es">Espírito Santo</option> 
                <option value="go">Goiás</option> 
                <option value="ma">Maranhão</option> 
                <option value="mt">Mato Grosso</option> 
                <option value="ms">Mato Grosso do Sul</option> 
                <option value="mg">Minas Gerais</option> 
                <option value="pa">Pará</option> 
                <option value="pb">Paraíba</option> 
                <option value="pr">Paraná</option> 
                <option value="pe">Pernambuco</option> 
                <option value="pi">Piauí</option> 
                <option value="rj">Rio de Janeiro</option> 
                <option value="rn">Rio Grande do Norte</option> 
                <option value="ro">Rondônia</option> 
                <option value="rs">Rio Grande do Sul</option> 
                <option value="rr">Roraima</option> 
                <option value="sc">Santa Catarina</option> 
                <option value="se">Sergipe</option> 
                <option value="sp">São Paulo</option> 
                <option value="to">Tocantins</option> 
            </select>
        </label>
        
        <br>

        <label class="Sexo">Sexo:
            <select name="Sexo">
                <option></option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
            </select>
        </label>

        <br>
        
        <label class="Bens-Pessoais">Bens Pessoais:<br> 
            Casa: <input type="checkbox"><br>
            Carro: <input type="checkbox"><br>
            Moto: <input type="checkbox"><br>
        </label>
        
        <br>

        <label class="Experiencias-pessoais">Experiências Pessoais:
            <textarea name="Experiencia-pessoal" id="exp-pessoal"></textarea>
        </label>
        
        <br>

        <label>
            <div class="Botao">
                <div>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </div>
            </div>
        </label>
    </fieldset>        
</body>
</html>
